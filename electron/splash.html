<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Edunova</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; width: 100%; overflow: hidden;
    background: radial-gradient(ellipse at center, #101828 0%, #0C0E14 70%, #05070B 100%);
    color: #E6FFFF;
    font-family: 'Segoe UI', system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-app-region: drag;
  }
  .grid {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(0,255,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,255,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: drift 12s linear infinite;
  }
  @keyframes drift { to { background-position: 40px 40px; } }
  .wrap {
    position: relative; z-index: 2;
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 28px;
  }
  .logo {
    width: 180px; height: 180px;
    filter: drop-shadow(0 0 24px rgba(0,255,255,0.55)) drop-shadow(0 0 40px rgba(0,230,118,0.35));
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); filter: drop-shadow(0 0 24px rgba(0,255,255,0.55)); }
    50%     { transform: scale(1.04); filter: drop-shadow(0 0 40px rgba(0,255,255,0.9)) drop-shadow(0 0 60px rgba(0,230,118,0.5)); }
  }
  .title {
    font-size: 32px; font-weight: 800; letter-spacing: 8px;
    background: linear-gradient(90deg, #00FFFF, #00E676);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 30px rgba(0,255,255,0.25);
  }
  .sub {
    font-family: 'Consolas', 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 4px; color: #4FD1D1;
    text-transform: uppercase;
  }
  .bar { width: 260px; height: 3px; background: rgba(0,255,255,0.1); border-radius: 999px; overflow: hidden; position: relative; }
  .bar::after {
    content: ''; position: absolute; inset: 0; width: 40%;
    background: linear-gradient(90deg, transparent, #00FFFF, #00E676, transparent);
    animation: slide 1.4s ease-in-out infinite;
  }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
  .status { font-family: 'Consolas', monospace; font-size: 10px; color: #6EE7E7; opacity: .7; }
  .corner { position: fixed; padding: 10px 14px; font-family: 'Consolas', monospace; font-size: 10px; color: #4FD1D1; opacity: .6; letter-spacing: 2px; }
  .tl { top: 0; left: 0; }
  .br { bottom: 0; right: 0; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="corner tl">v2.0 // NEXUS OS</div>
  <div class="corner br">Edunova · 2026</div>
  <div class="wrap">
    <img class="logo" src="assets/icon-512.png" alt="Edunova" />
    <div class="title">EDUNOVA</div>
    <div class="sub">Neural Learning Infrastructure</div>
    <div class="bar"></div>
    <div class="status" id="s">Booting cognitive lattice…</div>
  </div>
<script>
  const msgs = [
    'Booting cognitive lattice…',
    'Synchronizing neural profiles…',
    'Warming impact engine…',
    'Establishing secure tunnel…',
    'Loading nexus modules…'
  ];
  let i = 0; setInterval(() => { i=(i+1)%msgs.length; document.getElementById('s').textContent = msgs[i]; }, 900);
</script>
</body>
</html>
