<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Edunova</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #0c0e14; overflow: hidden;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: #e8ecf6; }
      .wrap { position: relative; height: 100%; display: grid; place-items: center; text-align: center; }
      .glow { position: absolute; inset: -40%; background:
        radial-gradient(420px 320px at 50% 20%, rgba(56,189,248,.22), transparent 70%),
        radial-gradient(360px 300px at 20% 90%, rgba(139,92,246,.18), transparent 70%); }
      .logo { width: 84px; height: 84px; border-radius: 22px; margin: 0 auto 18px;
        background: linear-gradient(140deg, #38bdf8, #8b5cf6); display: grid; place-items: center;
        font-weight: 800; font-size: 34px; color: #050810; box-shadow: 0 18px 50px rgba(56,189,248,.35);
        animation: float 2.6s ease-in-out infinite; }
      h1 { margin: 0; font-size: 22px; letter-spacing: .18em; text-transform: uppercase; }
      p { margin: 6px 0 22px; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: #8b96ad;
        font-family: ui-monospace, "JetBrains Mono", monospace; }
      .bar { width: 200px; height: 3px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; margin: 0 auto; }
      .bar span { display: block; height: 100%; width: 40%; border-radius: 999px;
        background: linear-gradient(90deg, #38bdf8, #8b5cf6); animation: slide 1.25s ease-in-out infinite; }
      @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="glow"></div>
      <div>
        <div class="logo">E</div>
        <h1>Edunova</h1>
        <p>Management Intelligence System</p>
        <div class="bar"><span></span></div>
      </div>
    </div>
  </body>
</html>
